# Include in the blog's HTTPS server block. Artalk listens on loopback only.
location = /comments { return 308 /comments/; }
location /comments/ {
    proxy_pass http://127.0.0.1:23366/;
    proxy_set_header Host $host;
    # Artalk reads the visitor IP from X-Real-IP (http.proxy_header in artalk.yml).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
}
