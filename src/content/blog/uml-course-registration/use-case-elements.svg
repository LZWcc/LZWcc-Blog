<svg xmlns="http://www.w3.org/2000/svg" width="640" height="680" viewBox="0 0 640 680" role="img" aria-labelledby="title desc">
  <title id="title">用例图的边界与关系教学示意</title>
  <desc id="desc">学生在系统边界外，以实线关联提交课程注册信息。include 箭头从提交指向校验。extend 箭头从扩展行为指向基础用例。此图不是原始实验截图。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#334155" stroke-width="1.8"/>
    </marker>
  </defs>
  <rect width="640" height="680" rx="12" fill="#ffffff"/>
  <g font-family="system-ui, sans-serif" fill="#172033">
    <text x="28" y="38" font-size="22" font-weight="600">系统边界与关联</text>
    <rect x="214" y="62" width="390" height="204" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
    <text x="232" y="92" font-size="19">大学课程注册系统</text>
    <g stroke="#334155" stroke-width="2" fill="none">
      <circle cx="100" cy="125" r="17"/>
      <path d="M100 142 V185 M68 158 H132 M100 185 L76 216 M100 185 L124 216"/>
      <path d="M132 168 H272"/>
      <ellipse cx="426" cy="169" rx="154" ry="38" fill="#ffffff"/>
    </g>
    <text x="100" y="246" text-anchor="middle" font-size="19">学生</text>
    <text x="426" y="176" text-anchor="middle" font-size="19">提交课程注册信息</text>
    <text x="28" y="299" font-size="16" fill="#475569">小人在边界外；椭圆在边界内；普通实线表示交互。</text>
    <text x="28" y="354" font-size="22" font-weight="600">include 指向被包含用例</text>
    <g stroke="#334155" stroke-width="1.8" fill="#f8fafc">
      <ellipse cx="159" cy="417" rx="131" ry="35"/>
      <ellipse cx="495" cy="417" rx="117" ry="35"/>
      <path d="M290 417 H376" stroke-dasharray="7 5" marker-end="url(#arrow)" fill="none"/>
    </g>
    <text x="159" y="424" text-anchor="middle" font-size="18">提交课程注册信息</text>
    <text x="495" y="424" text-anchor="middle" font-size="18">校验选课条件</text>
    <text x="334" y="388" text-anchor="middle" font-size="16">&lt;&lt;include&gt;&gt;</text>
    <text x="28" y="493" font-size="22" font-weight="600">extend 指向基础用例</text>
    <g stroke="#334155" stroke-width="1.8" fill="#f8fafc">
      <ellipse cx="159" cy="551" rx="131" ry="35"/>
      <ellipse cx="495" cy="551" rx="117" ry="35"/>
      <path d="M290 551 H376" stroke-dasharray="7 5" marker-end="url(#arrow)" fill="none"/>
    </g>
    <text x="159" y="558" text-anchor="middle" font-size="18">扩展行为</text>
    <text x="495" y="558" text-anchor="middle" font-size="18">基础用例</text>
    <text x="334" y="522" text-anchor="middle" font-size="16">&lt;&lt;extend&gt;&gt;</text>
    <text x="28" y="621" font-size="16" fill="#475569">extend 为概念示例，实际实验图中没有这条关系。</text>
    <text x="28" y="651" font-size="16" fill="#475569">教学示意图 · 非 Rational Rose 实验截图</text>
  </g>
</svg>
